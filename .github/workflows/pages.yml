name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - index.html
      - application.html
      - privacy.html
      - cookies.html
      - terms.html
      - translations.js
      - validation.js
      - imagen-hero.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only the public website files are published; the rest of the repo stays private
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html application.html privacy.html cookies.html terms.html translations.js validation.js imagen-hero.jpg _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
